name: Deploy Mobile Web (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MOBILE }}

jobs:
  deploy:
    name: Build & Deploy Mobile Web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Guard: no-op until VERCEL_PROJECT_ID_MOBILE is set as a GitHub secret
    # (prevents red CI during the transition before the secret exists).
    # NB: `env.*` is not available in job-level `if:` — use `secrets.*` directly.
    if: ${{ secrets.VERCEL_PROJECT_ID_MOBILE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install monorepo deps (hoisted)
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter=@ecole-saas/shared build

      - name: Build mobile web bundle (Expo export)
        run: pnpm --filter=@klasso/mobile build:web

      - name: Copy vercel.json into dist
        run: cp apps/mobile/vercel.json apps/mobile/dist/vercel.json

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy static dist to Vercel production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} apps/mobile/dist

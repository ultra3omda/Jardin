name: Deploy Mobile Web (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Mobile Web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install monorepo deps (hoisted)
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter=@ecole-saas/shared build

      - name: Build mobile web bundle (Expo export)
        run: pnpm --filter=@klasso/mobile build:web

      - name: Copy vercel.json into dist
        run: cp apps/mobile/vercel.json apps/mobile/dist/vercel.json

      - name: Link dist to Vercel project (.vercel/project.json)
        # Hard-coded team ID `team_yG29YmhWprcc7vjtWOuLN4BN` (ultra3omda-6664s-projects).
        # NOT a secret — team IDs are public and stable for the team's lifetime.
        # The repo's VERCEL_ORG_ID secret resolves to a stale scope that no longer
        # holds the klasso-mobile project, so we bypass it.
        run: |
          mkdir -p apps/mobile/dist/.vercel
          cat > apps/mobile/dist/.vercel/project.json <<EOF
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID_MOBILE }}",
            "orgId": "team_yG29YmhWprcc7vjtWOuLN4BN"
          }
          EOF

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy static dist to Vercel production
        # Reads .vercel/project.json from --cwd; no VERCEL_ORG_ID/PROJECT_ID
        # env interference at this point (workflow-level env block removed).
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=ultra3omda-6664s-projects --cwd apps/mobile/dist

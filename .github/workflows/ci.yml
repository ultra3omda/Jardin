name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Job 1 — Lint, type-check & build (web + api + shared)
  # ---------------------------------------------------------------------
  lint-typecheck-build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Ecole SaaS' }}

  # ---------------------------------------------------------------------
  # Job 2 — API tests (unit + e2e + multi-tenant isolation)
  # ---------------------------------------------------------------------
  test-api:
    name: API tests (unit + e2e + isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecole_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecole_saas?schema=public
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      BCRYPT_ROUNDS: '10'
      API_PORT: '4000'
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Generate ephemeral JWT secrets for this CI run
        # Secrets are generated fresh per run — never persisted in repo.
        # Keeps GitGuardian and other static scanners happy (no dummy
        # high-entropy strings checked in to source).
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=@ecole-saas/api exec prisma generate

      - name: Apply schema to CI database (no migration files yet — use db push)
        run: pnpm --filter=@ecole-saas/api exec prisma db push --skip-generate --accept-data-loss

      - name: Run API tests with coverage
        run: pnpm --filter=@ecole-saas/api test:cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Job 3 — Web E2E (Playwright against full stack: web + API + Postgres)
  # ---------------------------------------------------------------------
  test-e2e-web:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecole_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # NB: NODE_ENV is intentionally NOT set to production at the job level
      # because pnpm install would skip devDependencies (incl. prisma CLI),
      # which would break the apps/api postinstall hook. We set NODE_ENV=
      # production only on the "Start API" and "Start web" steps below.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecole_saas?schema=public
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      BCRYPT_ROUNDS: '10'
      API_PORT: '4000'
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: 'Ecole SaaS'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Generate ephemeral JWT secrets for this CI run
        # Same rationale as in test-api: avoids checking in any dummy
        # high-entropy string that scanners would flag as a leak.
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=@ecole-saas/api exec prisma generate

      - name: Apply schema to CI database (no migration files yet — use db push)
        run: pnpm --filter=@ecole-saas/api exec prisma db push --skip-generate --accept-data-loss

      - name: Build API
        run: pnpm --filter=@ecole-saas/api build

      - name: Build web
        run: pnpm --filter=@ecole-saas/web build

      - name: Install Playwright browsers
        run: pnpm --filter=@ecole-saas/web exec playwright install --with-deps chromium

      - name: Start API (background)
        env:
          NODE_ENV: production
        run: |
          echo "::group::apps/api/dist contents"
          find apps/api/dist -maxdepth 2 -type f 2>&1 | head -20 || echo "(dist not found)"
          echo "::endgroup::"
          if [ ! -f apps/api/dist/main.js ]; then
            echo "::error::apps/api/dist/main.js missing — nest build output mislocated."
            exit 1
          fi
          nohup pnpm --filter=@ecole-saas/api start > api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become ready in 60s"
          cat api.log
          exit 1

      - name: Start web (background)
        env:
          NODE_ENV: production
        run: |
          nohup pnpm --filter=@ecole-saas/web start > web.log 2>&1 &
          echo "WEB_PID=$!" >> $GITHUB_ENV

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "Web ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Web did not become ready in 60s"
          cat web.log
          exit 1

      - name: Run Playwright tests
        env:
          CI: 'true'
        run: pnpm --filter=@ecole-saas/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/*.log
          if-no-files-found: ignore

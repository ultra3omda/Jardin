name: Deploy Web (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid stacking redundant production deploys: if a new commit lands on main
# while a deploy is still running, cancel the in-flight one. Fewer deploys =
# fewer file uploads against the Hobby plan's upload rate limit.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Vercel CLI
        # Pinned: vercel@54.7.0 ships a broken ESM/CJS import
        # ("isPackageInstalled not found" in @vercel/build-utils) that fails
        # `vercel build`. 54.6.1 is the last known-good release we deploy with.
        run: pnpm add -g vercel@54.6.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --archive=tgz uploads ONE compressed archive instead of thousands of
      # individual files, which is what tripped the Hobby plan's
      # "api-upload-free" rate limit (>5000 uploads). This keeps the CLI deploy
      # path 100% within the free tier.
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

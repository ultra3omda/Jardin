name: Reset super-admin password

# Crée (ou ré-émet) le compte super-admin Klasso sur la base de production.
#
# Le mot de passe vient de l'input `password` (ou est GÉNÉRÉ automatiquement et
# affiché dans les logs si laissé vide) — plus besoin de secret pour ça.
#
# Secret requis :   DATABASE_URL   (chaîne de connexion Postgres prod)
# Inputs :          email          (défaut: support@klasso.tn)
#                   password       (optionnel; vide => généré + affiché)
#
# Après exécution : connexion sur https://klasso.tn/login avec cet email + mot
# de passe. Toutes les sessions super-admin précédentes sont invalidées.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email du super-admin'
        required: false
        default: 'support@klasso.tn'
      password:
        description: 'Mot de passe (>=12 car.). Laisser VIDE pour en générer un automatiquement (affiché dans les logs).'
        required: false
        default: ''

jobs:
  reset:
    name: Reset super-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate on DATABASE_URL secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::Le secret DATABASE_URL est requis (chaîne Postgres prod)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=@ecole-saas/api exec prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter=@ecole-saas/api exec prisma migrate deploy

      - name: Reset / create super-admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPER_ADMIN_EMAIL: ${{ inputs.email }}
          # Vide => le script génère un mot de passe et l'affiche dans les logs.
          SUPER_ADMIN_NEW_PASSWORD: ${{ inputs.password }}
        run: pnpm --filter=@ecole-saas/api exec tsx scripts/reset-super-admin-password.ts
